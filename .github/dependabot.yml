version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns:
          - vue
          - '@vue/*'
          - '@vitejs/plugin-vue'
          - vue-tsc
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      vite-plus:
        patterns:
          - vite
          - vite-plus
          - '@voidzero-dev/*'
